services:
    db:
        image: mysql:latest
        container_name: techchallenge-db
        restart: always
        environment:
            TZ: America/Sao_Paulo
            MYSQL_ROOT_PASSWORD: admin1234
            MYSQL_USER: techchallenge
            MYSQL_PASSWORD: admin1234
            MYSQL_DATABASE: techchallenge
        ports:
            - "3306:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./init-scripts:/docker-entrypoint-initdb.d
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin1234"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - techchallenge-network

    app:
        build: .
        container_name: techchallenge
        restart: always
        ports:
            - "8080:8080"
        environment:
            DB_HOST: db
        depends_on:
            db:
                condition: service_healthy
        networks:
            - techchallenge-network

volumes:
    mysql_data:

networks:
    techchallenge-network:
        driver: bridge
